<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Currency Calculator</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">
<header>
<h1><i class="fas fa-exchange-alt"></i> Modern Currency Calculator</h1>
<p>Real-time exchange rates and currency comparison tool</p>
</header>

<main>

<div class="card">

<h2 class="card-title">
<i class="fas fa-calculator"></i> Currency Converter
</h2>

<div class="calculator-container">

<div class="converter-section">

<div class="input-group">
<label for="amount">Amount</label>

<div class="currency-input">

<input type="number" id="amount" value="1" min="0" step="0.01">

<div class="currency-selector">
<select id="from-currency">

<option value="USD">USD</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="JPY">JPY</option>
<option value="CAD">CAD</option>
<option value="AUD">AUD</option>
<option value="CHF">CHF</option>
<option value="CNY">CNY</option>
<option value="INR">INR</option>
<option value="PKR">PKR</option>
<option value="AED">AED</option>
<option value="SAR">SAR</option>

</select>
</div>

</div>
</div>

<button class="swap-btn" id="swap-btn">
<i class="fas fa-exchange-alt"></i>
</button>

<div class="input-group">

<label for="to-currency">Converted To</label>

<div class="currency-input">

<input type="text" id="result" readonly>

<div class="currency-selector">

<select id="to-currency">

<option value="EUR">EUR</option>
<option value="USD">USD</option>
<option value="GBP">GBP</option>
<option value="JPY">JPY</option>
<option value="CAD">CAD</option>
<option value="AUD">AUD</option>
<option value="CHF">CHF</option>
<option value="CNY">CNY</option>
<option value="INR">INR</option>
<option value="PKR">PKR</option>
<option value="AED">AED</option>
<option value="SAR">SAR</option>

</select>

</div>

</div>

</div>

<div class="result-container">

<h3>Exchange Rate</h3>

<div class="result-value" id="exchange-rate">
1 USD = 0.93 EUR
</div>

<div class="exchange-rate" id="rate-timestamp">
Last updated: Just now
</div>

</div>

</div>

<div class="chart-container">
<canvas id="trend-chart"></canvas>
</div>

</div>

</div>


<div class="card comparison-section">

<h2 class="card-title">
<i class="fas fa-chart-bar"></i> Currency Comparison
</h2>

<div class="search-container">

<i class="fas fa-search"></i>

<input type="text"
id="currency-search"
placeholder="Search currencies...">

</div>

<div class="currencies-grid"
id="currencies-grid">

</div>

</div>

</main>

<footer>

<p>
© 2023 Modern Currency Calculator |
Real-time exchange rates powered by ExchangeRate-API
</p>

</footer>

</div>

<script src="script.js"></script>

</body>
</html>
